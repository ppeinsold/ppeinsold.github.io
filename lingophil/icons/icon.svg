<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    The Lingophil mark: an ñ whose tilde is the traveller's sombrero, its brim
    drawn as the wave of the tilde. Drawn in the redesign's language (tokens.css):
    magic purple ground, marigold hat with a rosa band, and the letter as a
    tactile slab — a cream face on a deep edge, like the app's buttons.

    Paths only, no live text, so any rasteriser renders the same picture.
    The source for every raster icon and launch image (scripts/gen-assets.mjs),
    which finds the ground by rx="112" and the picture by id="art".
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A894FF"/>
      <stop offset=".5" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#4A2CC4"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD36B"/>
      <stop offset="1" stop-color="#FFB21E"/>
    </linearGradient>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#ground)"/>
  <!-- the sun: flat discs rather than a soft gradient, which would treble the PNGs -->
  <g clip-path="url(#tile)" fill="#FFE79A" opacity=".12">
    <circle cx="404" cy="104" r="150"/>
    <circle cx="404" cy="104" r="86" opacity="1"/>
  </g>

  <g id="art" transform="translate(0 -4)">
    <!-- the n: deep edge, then the cream face 12 px above it -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="62">
      <path d="M198 404V262M198 312c0-40 28-60 60-60s58 20 58 60v92" stroke="#3B2A9E" transform="translate(0 12)"/>
      <path d="M198 404V262M198 312c0-40 28-60 60-60s58 20 58 60v92" stroke="#FFF5E6"/>
    </g>

    <!-- the sombrero as the tilde, tipped a little -->
    <g transform="translate(4 -26) rotate(-6 256 180)">
      <!-- crown -->
      <path d="M208 196c0-58 20-90 48-90s48 32 48 90z" fill="url(#crown)"/>
      <path d="M211 150c28 8 62 8 90 0l1.5 18c-30 9-63 9-93 0z" fill="#FF4F9A"/>
      <!-- brim: the wave of the tilde, on its own edge -->
      <path d="M128 206c34-36 82-40 128-14s94 22 128-14" fill="none" stroke="#D98200" stroke-width="34" stroke-linecap="round" transform="translate(0 9)"/>
      <path d="M128 206c34-36 82-40 128-14s94 22 128-14" fill="none" stroke="#FFB21E" stroke-width="34" stroke-linecap="round"/>
      <path d="M150 196c28-22 64-24 100-6" fill="none" stroke="#FFE79A" stroke-width="7" stroke-linecap="round" opacity=".8"/>
    </g>
  </g>
</svg>
