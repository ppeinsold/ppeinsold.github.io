<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2d6e"/>
      <stop offset="55%" stop-color="#5b3fb5"/>
      <stop offset="100%" stop-color="#8b3fd4"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8f5a"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft glow -->
  <circle cx="118" cy="108" r="132" fill="#ffffff" opacity="0.07"/>

  <!-- teal accent bubble behind -->
  <path d="M300 138h74a44 44 0 0 1 44 44v78a44 44 0 0 1-44 44h-16l-4 40-38-40h-16a44 44 0 0 1-44-44v-78a44 44 0 0 1 44-44z"
        fill="url(#mint)" opacity="0.9"/>

  <!-- main speech bubble -->
  <path d="M136 128h192a56 56 0 0 1 56 56v128a56 56 0 0 1-56 56H236l-74 62 10-62h-36a56 56 0 0 1-56-56V184a56 56 0 0 1 56-56z"
        fill="url(#bubble)"/>

  <!-- The ñ, drawn as paths rather than live text: a rasteriser without the
       right font installed would otherwise render this icon with no letter. -->
  <g fill="none" stroke="#2b2d6e" stroke-linecap="round" stroke-linejoin="round">
    <path d="M212 326V270" stroke-width="34" />
    <path d="M212 272c0-24 19-33 42-33 23 0 42 9 42 33v54" stroke-width="34" />
    <path d="M218 200c9-13 23-13 32-2 9 10 23 10 32-2" stroke-width="18" />
  </g>
</svg>
